<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NVDA Add-on Download Statistics</title>

  <style>
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #000;
      padding: 0.4em;
    }
    th button {
      all: unset;
      cursor: pointer;
      font-weight: bold;
    }
    th button:focus {
      outline: 2px solid #000;
    }
  </style>
</head>

<body>

<h1>NVDA Add-on Download Statistics</h1>

<p>
This table lists NVDA add-ons and their versions, with download counts retrieved
from GitHub when available.
</p>

<section aria-label="Filters" id="filters" style="margin-bottom:1em;">

  <label for="channel-filter">Channel:</label>
  <select id="channel-filter" name="channel">
    <option value="all">All</option>
    <option value="stable">Stable</option>
    <option value="beta">Beta</option>
    <option value="dev">Dev</option>
  </select>

  <label for="status-filter" style="margin-left: 2em;">Status:</label>
  <select id="status-filter" name="status">
    <option value="all">All add-ons</option>
    <option value="github_release">GitHub release</option>
    <option value="not_github_release">Not a GitHub release</option>
  </select>
</section>

<table>
  <thead>
    <tr>
      <th scope="col">
        <button type="button" data-sort="name">Name</button>
      </th>
      <th scope="col">
        <button type="button" data-sort="version">Version</button>
      </th>
      <th scope="col">
        <button type="button" data-sort="channel">Channel</button>
      </th>
      <th scope="col">
        <button type="button" data-sort="publisher">Publisher</button>
      </th>
      <th scope="col">
        <button type="button" data-sort="submission_time">Publication date</button>
      </th>
      <th scope="col">
        <button type="button" data-sort="download_count">Downloads</button>
      </th>
      <th scope="col">
        <button type="button" data-sort="status">Status</button>
      </th>
    </tr>
  </thead>
  <tbody id="table-body">
    <!-- rows inserted by JavaScript -->
  </tbody>
</table>

<p id="meta-info"></p>

<footer>
  <p>
    &copy; 2026 Cyrille Bougot. Licensed under <a href="https://github.com/CyrilleB79/NVDAAddonsStats/blob/main/LICENSE" target="_blank" rel="noopener">
      GNU General Public License v2 or later
    </a>
    .
    Source code on <a href="https://github.com/CyrilleB79/NVDAAddonsStats" target="_blank" rel="noopener">GitHub</a>.
  </p>
</footer>

<script src="js/index.js"></script>

</body>
</html>
